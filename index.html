<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Radicales Chinos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Opcional: Cargar Hanzi Writer si se usa -->
    <!-- <script src="lib/hanzi-writer.min.js"></script> -->
</head>
<body>
    <header>
        <h1>Estudio de Radicales Chinos (Basado en los 214 Radicales Kangxi)</h1>
        <div class="quiz-controls">
            <button id="start-quiz-btn">🎮 Iniciar Quiz Aleatorio</button>
            <button id="start-study-btn">📚 Estudio</button>
        </div>
    </header>

    <main id="radical-list-container">
        <!-- Los radicales se cargarán aquí mediante JavaScript -->
        <p>Cargando radicales...</p>
    </main>

    <!-- Modal para Configuración del Quiz -->
    <div id="quiz-config-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-quiz-config-modal">×</span>
            <h2>Configuración del Quiz</h2>
            <div class="config-area">
                <div class="config-controls">
                    <label for="quiz-count">Número de preguntas:</label>
                    <input type="number" id="quiz-count" value="10" min="1" max="50">
                    <button id="start-quiz-session">Comenzar Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para el Quiz -->
    <div id="quiz-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-quiz-modal">×</span>
            <h2>Quiz de Radicales</h2>
            <div id="quiz-area">
                <p id="quiz-question"></p>
                <div id="quiz-options"></div>
                <input type="text" id="quiz-answer" placeholder="Escribe tu respuesta aquí">
                <button id="submit-quiz-answer">Enviar Respuesta</button>
                <p id="quiz-feedback"></p>
                <button id="next-quiz-question" style="display: none;">Siguiente</button>
            </div>
            <div id="quiz-results" style="display: none;">
                <h3>Resultados del Quiz</h3>
                <p id="quiz-score"></p>
                <button id="restart-quiz-btn">Volver a Empezar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Configuración del Estudio -->
    <div id="study-config-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-study-config-modal">×</span>
            <h2>Configuración del Estudio</h2>
            <div class="config-area">
                <div class="config-controls">
                    <label for="study-count">Número de radicales a estudiar:</label>
                    <input type="number" id="study-count" value="10" min="1" max="50">
                    <button id="start-study-session">Comenzar Estudio</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para el Estudio -->
    <div id="study-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-study-modal">×</span>
            <h2>Modo Estudio</h2>
            <div id="study-card">
                <div class="radical-char-study"></div>
                <div class="radical-info">
                    <p><strong>Pinyin:</strong> <span class="radical-pinyin"></span></p>
                    <p><strong>Significado:</strong> <span class="radical-meaning"></span></p>
                </div>
                <div class="study-buttons">
                    <button class="pronounce-study-btn" title="Escuchar pronunciación">🔊</button>
                    <button class="learned-btn">Ya lo aprendí</button>
                    <button class="not-learned-btn">No lo sabía</button>
                </div>
            </div>
            <div id="study-progress"></div>
        </div>
    </div>

    <!-- Modal para Práctica de Escritura -->
    <div id="writing-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-writing-modal">×</span>
            <h2>Practicar Escritura</h2>
            <div id="writing-area">
                <div id="hanzi-writer-target"></div>
                <canvas id="practice-canvas" width="200" height="200" style="display: none;"></canvas>
                <button id="clear-canvas-btn" style="display: none;">Borrar Trazos</button>
            </div>
            <p id="writing-radical-info"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="radical_data.js"></script>
    <script src="script.js"></script>
</body>
</html>
